[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-anything-aidee"
version = "2.0.0"
description = "Aidee personal and authorized team recording CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click==8.1.8", "requests==2.33.1", "cryptography==48.0.1", "keyring==25.7.0", "packaging==26.0", "tzdata==2025.2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
aidee = "cli_anything.aidee.aidee_cli:main"
cli-anything-aidee = "cli_anything.aidee.aidee_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cli_anything.*"]
namespaces = true

[tool.setuptools.package-data]
"cli_anything.aidee" = ["skills/*.md", "release-public-key.pem", "build.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
