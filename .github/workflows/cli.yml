name: Aidee CLI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        platform:
          - {runner: ubuntu-24.04, arch: x64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
          - {runner: macos-15-intel, arch: x64}
          - {runner: macos-15, arch: arm64}
          - {runner: windows-2022, arch: x64}
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.platform.arch }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python "${{ matrix.python }}" --extra test --locked
      - name: Check actual target architecture
        run: uv run python -c "import platform; assert platform.machine().lower() in ({'x64':['x86_64','amd64'],'arm64':['arm64','aarch64']})['${{ matrix.platform.arch }}'], platform.machine()"
      - run: uv run --with ruff==0.14.0 ruff check src tests scripts
      - run: uv build --wheel
      - run: uv run python -m pytest -q
      - run: uv run python scripts/verify-wheel.py
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    environment: cli-release
    concurrency:
      group: aidee-cli-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      AIDEE_RELEASE_SIGNING_KEY_PEM: ${{ secrets.AIDEE_RELEASE_SIGNING_KEY_PEM }}
      AIDEE_RELEASE_PUBLIC_KEY_PEM: ${{ vars.AIDEE_RELEASE_PUBLIC_KEY_PEM }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_ENDPOINT: https://oss-cn-shenzhen.aliyuncs.com
      OSS_REGION: cn-shenzhen
      OSS_RELEASE_PREFIX: aidee-cli
      AIDEE_RELEASE_BASE: https://ai-agent.ideamake.cn/aidee-cli
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra test --locked
      - name: Build and sign immutable release
        run: uv run python scripts/release.py "$GITHUB_REF_NAME" --base "$AIDEE_RELEASE_BASE"
      - name: Validate built artifact
        run: uv run python scripts/verify-wheel.py
      - name: Install OSS utility
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip -o /tmp/ossutil.zip
          echo '3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  /tmp/ossutil.zip' | sha256sum -c -
          unzip -p /tmp/ossutil.zip ossutil-2.3.0-linux-amd64/ossutil > /tmp/ossutil
          chmod +x /tmp/ossutil
          echo /tmp >> "$GITHUB_PATH"
      - name: Publish immutable version and verify before promotion
        run: |
          version="$(uv run python -c 'import json;print(json.load(open("dist/manifest.json"))["version"])')"
          target="oss://$OSS_BUCKET/$OSS_RELEASE_PREFIX/versions/$version"
          if object_status="$(ossutil stat "$target/manifest.json" 2>&1)"; then
            echo 'Version already exists; refuse overwrite'; exit 1
          else
            case "$object_status" in *NoSuchKey*|*404*) ;; *) echo 'Cannot verify immutable version absence'; exit 1 ;; esac
          fi
          ossutil cp dist/ "$target/" --recursive --cache-control public,max-age=31536000,immutable
          uv run python scripts/promote.py
      - name: Attach release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes)
          channel="$(python -c 'import json;print(json.load(open("dist/manifest.json"))["channel"])')"
          if [ "$channel" = preview ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/manifest.json dist/manifest.sig "${flags[@]}"
